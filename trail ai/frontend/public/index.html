<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIAL AI - AI-Powered Smart Tourist Guide</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- React 18 and Babel for in-browser JSX rendering -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            },
            accent: {
              50: '#fffbeb',
              100: '#fef3c7',
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border-radius: 0.75rem;
      border: 1px solid #334155;
    }
    .leaflet-popup-tip {
      background: #1e293b;
    }
    /* Hide scrollbar for tabs */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // API Base URL
    const API_BASE = window.location.origin;

    // ================= MAIN APP COMPONENT =================
    function App() {
      // Navigation state
      const [currentScreen, setCurrentScreen] = useState('landing'); // landing, dashboard, plan, generating, trip_hub, saved_trips
      const [activeTab, setActiveTab] = useState('itinerary'); // itinerary, map, recommendations, hotel, food, budget, offline
      
      // User authentication state
      const [user, setUser] = useState(null);
      const [isLoggedIn, setIsLoggedIn] = useState(false);

      // Current active trip
      const [currentTrip, setCurrentTrip] = useState(null);
      const [savedTrips, setSavedTrips] = useState([]);
      const [isOfflineMode, setIsOfflineMode] = useState(false);
      const [selectedDay, setSelectedDay] = useState(1);
      const [generatingStep, setGeneratingStep] = useState(0);

      // Feedback state
      const [feedbackRating, setFeedbackRating] = useState(5);
      const [feedbackComment, setFeedbackComment] = useState('');
      const [feedbackSubmitted, setFeedbackSubmitted] = useState(false);

      // Trip Form State matching exact prompt requirements:
      // Kerala, 3 days, 2 travelers, ₹15,000, Waterfalls, Trekking, Local Food, Budget Hotel, Moderate pace
      const [formData, setFormData] = useState({
        destination: 'Kerala',
        duration_days: 3,
        number_of_travelers: 2,
        budget: 15000,
        currency: 'INR',
        interests: ['Waterfalls', 'Trekking'],
        food_preference: 'Local Food',
        hotel_preference: 'Budget Hotel',
        travel_pace: 'Moderate pace',
        transport_preference: 'Local Taxi / Cab',
        max_daily_travel_hours: 4.0
      });

      // Initialize on load
      useEffect(() => {
        // Load saved trips from localStorage
        const cached = localStorage.getItem('trial_ai_saved_trips');
        if (cached) {
          try {
            setSavedTrips(JSON.parse(cached));
          } catch(e) {}
        }
        // Fetch demo user info
        fetch(`${API_BASE}/auth/demo-user`)
          .then(res => res.json())
          .then(data => {
            // User can do Demo Login
          })
          .catch(err => console.log('Backend init note:', err));
      }, []);

      // Demo Login Handler
      const handleDemoLogin = () => {
        const demoUser = {
          user_id: 'user_demo_traveler',
          name: 'Priya & Rahul',
          email: 'travelers@example.com',
          is_demo: true
        };
        setUser(demoUser);
        setIsLoggedIn(true);
        setCurrentScreen('dashboard');
      };

      // Generate Trip Handler
      const handleGenerateTrip = async () => {
        setCurrentScreen('generating');
        setGeneratingStep(1);

        try {
          // Animation steps
          setTimeout(() => setGeneratingStep(2), 500);
          setTimeout(() => setGeneratingStep(3), 1000);
          setTimeout(() => setGeneratingStep(4), 1500);

          // API Call to create and plan trip
          const tripId = `trip_${Date.now()}`;
          const res = await fetch(`${API_BASE}/trips/${tripId}/plan`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });

          if (!res.ok) {
            throw new Error(`Server returned ${res.status}`);
          }

          const tripData = await res.json();
          setTimeout(() => {
            setGeneratingStep(5);
            setTimeout(() => {
              setCurrentTrip(tripData);
              // Save to local savedTrips
              const updated = [tripData, ...savedTrips.filter(t => t.trip_id !== tripData.trip_id)];
              setSavedTrips(updated);
              localStorage.setItem('trial_ai_saved_trips', JSON.stringify(updated));
              setCurrentScreen('trip_hub');
              setActiveTab('itinerary');
            }, 600);
          }, 800);

        } catch (err) {
          console.error("Trip Generation Error:", err);
          alert("Error generating trip: " + err.message);
          setCurrentScreen('plan');
        }
      };

      // Offline Package Download
      const handleDownloadOffline = () => {
        if (!currentTrip) return;
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentTrip.offline_package || currentTrip, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Trial_AI_${currentTrip.profile.destination}_Offline_Guide.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        alert("Offline Package downloaded! Route sequence, emergency contacts and coordinates are saved for offline use.");
      };

      // Toggle Offline Simulation Mode
      const toggleOfflineMode = () => {
        setIsOfflineMode(!isOfflineMode);
      };

      // Submit feedback
      const handleSendFeedback = async () => {
        if (!currentTrip) return;
        try {
          await fetch(`${API_BASE}/trips/${currentTrip.trip_id}/feedback`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              trip_id: currentTrip.trip_id,
              user_id: user?.user_id || 'demo_user',
              rating: feedbackRating,
              helpful: feedbackRating >= 4,
              comment: feedbackComment,
              liked_stops: currentTrip.daily_plans[0]?.stops.map(s => s.name) || []
            })
          });
          setFeedbackSubmitted(true);
        } catch (e) {
          setFeedbackSubmitted(true);
        }
      };

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          {/* Top Offline Mode Banner */}
          {isOfflineMode && (
            <div id="offline-banner" className="bg-amber-500 text-slate-950 px-4 py-2 text-center text-sm font-semibold flex items-center justify-center gap-2 shadow-lg">
              <span>⚠️ OFFLINE MODE ACTIVE: Using cached itinerary & local emergency contacts. Real-time traffic & pricing paused.</span>
              <button onClick={toggleOfflineMode} className="bg-slate-950 text-amber-300 text-xs px-2.5 py-1 rounded ml-2 hover:bg-slate-900">
                Go Online
              </button>
            </div>
          )}

          {/* Navigation Bar */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              {/* Logo */}
              <div 
                className="flex items-center gap-3 cursor-pointer"
                onClick={() => setCurrentScreen(isLoggedIn ? 'dashboard' : 'landing')}
                id="btn-nav-logo"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 text-white font-extrabold text-xl">
                  T
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-emerald-400 bg-clip-text text-transparent">
                      TRIAL AI
                    </span>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      IEEE 2026
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 hidden sm:block">AI-Powered Smart Tourist Guide</p>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="flex items-center gap-3">
                {isLoggedIn ? (
                  <>
                    <button 
                      onClick={() => setCurrentScreen('dashboard')}
                      id="nav-dashboard"
                      className={`text-sm font-medium px-3 py-1.5 rounded-lg transition ${currentScreen === 'dashboard' ? 'bg-slate-800 text-emerald-400' : 'text-slate-300 hover:text-white'}`}
                    >
                      Dashboard
                    </button>
                    <button 
                      onClick={() => setCurrentScreen('plan')}
                      id="nav-plan-trip"
                      className={`text-sm font-medium px-3 py-1.5 rounded-lg transition ${currentScreen === 'plan' ? 'bg-slate-800 text-emerald-400' : 'text-slate-300 hover:text-white'}`}
                    >
                      Plan Trip
                    </button>
                    {currentTrip && (
                      <button 
                        onClick={() => setCurrentScreen('trip_hub')}
                        id="nav-view-trip"
                        className={`text-sm font-medium px-3 py-1.5 rounded-lg transition ${currentScreen === 'trip_hub' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                      >
                        Trip Plan ({currentTrip.profile.destination})
                      </button>
                    )}
                    <button 
                      onClick={() => setCurrentScreen('saved_trips')}
                      id="nav-saved-trips"
                      className={`text-sm font-medium px-3 py-1.5 rounded-lg transition ${currentScreen === 'saved_trips' ? 'bg-slate-800 text-emerald-400' : 'text-slate-300 hover:text-white'}`}
                    >
                      Saved Trips ({savedTrips.length})
                    </button>
                    <div className="h-4 w-px bg-slate-700 hidden sm:block"></div>
                    <div className="flex items-center gap-2 pl-1">
                      <div className="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-xs font-bold text-emerald-400">
                        PR
                      </div>
                      <span className="text-xs font-medium text-slate-300 hidden md:inline">{user?.name}</span>
                    </div>
                  </>
                ) : (
                  <>
                    <button 
                      onClick={handleDemoLogin}
                      id="btn-demo-login-header"
                      className="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-xl transition shadow-lg shadow-emerald-600/20 flex items-center gap-1.5"
                    >
                      <span>Demo Login</span>
                      <span className="text-xs opacity-75">→</span>
                    </button>
                  </>
                )}
              </nav>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col pb-24 sm:pb-6">
            {/* 1. LANDING SCREEN */}
            {currentScreen === 'landing' && (
              <LandingView 
                onDemoLogin={handleDemoLogin} 
                onStartPlanning={() => { handleDemoLogin(); setCurrentScreen('plan'); }}
              />
            )}

            {/* 2. DASHBOARD SCREEN */}
            {currentScreen === 'dashboard' && (
              <DashboardView 
                user={user}
                savedTrips={savedTrips}
                onPlanNew={() => setCurrentScreen('plan')}
                onViewTrip={(trip) => { setCurrentTrip(trip); setCurrentScreen('trip_hub'); }}
              />
            )}

            {/* 3. PLAN TRIP SCREEN */}
            {currentScreen === 'plan' && (
              <PlanTripView 
                formData={formData}
                setFormData={setFormData}
                onGenerate={handleGenerateTrip}
              />
            )}

            {/* 4. GENERATING ANIMATION SCREEN */}
            {currentScreen === 'generating' && (
              <GeneratingView step={generatingStep} />
            )}

            {/* 5. TRIP HUB (ITINERARY, MAP, RECOMMENDATIONS, BUDGET, OFFLINE) */}
            {currentScreen === 'trip_hub' && currentTrip && (
              <TripHubView 
                trip={currentTrip}
                activeTab={activeTab}
                setActiveTab={setActiveTab}
                selectedDay={selectedDay}
                setSelectedDay={setSelectedDay}
                isOfflineMode={isOfflineMode}
                onToggleOffline={toggleOfflineMode}
                onDownloadOffline={handleDownloadOffline}
                feedbackRating={feedbackRating}
                setFeedbackRating={setFeedbackRating}
                feedbackComment={feedbackComment}
                setFeedbackComment={setFeedbackComment}
                feedbackSubmitted={feedbackSubmitted}
                onSendFeedback={handleSendFeedback}
              />
            )}

            {/* 6. SAVED TRIPS SCREEN */}
            {currentScreen === 'saved_trips' && (
              <SavedTripsView 
                savedTrips={savedTrips}
                onSelectTrip={(t) => { setCurrentTrip(t); setCurrentScreen('trip_hub'); }}
                onDeleteTrip={(id) => {
                  const updated = savedTrips.filter(t => t.trip_id !== id);
                  setSavedTrips(updated);
                  localStorage.setItem('trial_ai_saved_trips', JSON.stringify(updated));
                }}
                onPlanNew={() => setCurrentScreen('plan')}
              />
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800/80 bg-slate-900/50 py-6 text-xs text-slate-500 text-center mb-16 sm:mb-0">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <p>TRIAL AI Prototype • Verified Research Integration (IEEE ICUIS 2025 & ICARC 2026)</p>
              <p>Built with React, FastAPI, Deterministic Constraints & Explainable Scoring</p>
            </div>
          </footer>

          {/* Mobile Bottom Navigation Bar (Visible on mobile viewports) */}
          {isLoggedIn && currentTrip && (
            <div className="sm:hidden fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-3 py-2 flex items-center justify-around text-[10px] text-slate-400 shadow-2xl">
              <button 
                onClick={() => { setCurrentScreen('trip_hub'); setActiveTab('itinerary'); }}
                className={`flex flex-col items-center gap-1 p-1 ${activeTab === 'itinerary' && currentScreen === 'trip_hub' ? 'text-emerald-400 font-bold' : ''}`}
                id="mobile-tab-itinerary"
              >
                <span>📅</span>
                <span>Itinerary</span>
              </button>
              <button 
                onClick={() => { setCurrentScreen('trip_hub'); setActiveTab('map'); }}
                className={`flex flex-col items-center gap-1 p-1 ${activeTab === 'map' && currentScreen === 'trip_hub' ? 'text-emerald-400 font-bold' : ''}`}
                id="mobile-tab-map"
              >
                <span>🗺️</span>
                <span>Map</span>
              </button>
              <button 
                onClick={() => { setCurrentScreen('trip_hub'); setActiveTab('budget'); }}
                className={`flex flex-col items-center gap-1 p-1 ${activeTab === 'budget' && currentScreen === 'trip_hub' ? 'text-emerald-400 font-bold' : ''}`}
                id="mobile-tab-budget"
              >
                <span>💰</span>
                <span>Budget</span>
              </button>
              <button 
                onClick={() => { setCurrentScreen('trip_hub'); setActiveTab('recommendations'); }}
                className={`flex flex-col items-center gap-1 p-1 ${activeTab === 'recommendations' && currentScreen === 'trip_hub' ? 'text-emerald-400 font-bold' : ''}`}
                id="mobile-tab-ai"
              >
                <span>🧠</span>
                <span>Explain</span>
              </button>
              <button 
                onClick={() => { setCurrentScreen('trip_hub'); setActiveTab('offline'); }}
                className={`flex flex-col items-center gap-1 p-1 ${activeTab === 'offline' && currentScreen === 'trip_hub' ? 'text-emerald-400 font-bold' : ''}`}
                id="mobile-tab-offline"
              >
                <span>📲</span>
                <span>Offline</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // ================= 1. LANDING VIEW =================
    function LandingView({ onDemoLogin, onStartPlanning }) {
      return (
        <div className="flex-1 flex flex-col justify-center items-center px-4 py-12 sm:px-6 lg:px-8 max-w-5xl mx-auto text-center">
          <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold mb-6">
            <span>✨ Research Foundations: IEEE ICUIS 2025 & ICARC 2026</span>
          </div>

          <h1 className="text-4xl sm:text-6xl font-extrabold tracking-tight text-white mb-6 leading-tight">
            AI-Powered Smart <br />
            <span className="bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
              Tourist Guide & Route Planner
            </span>
          </h1>

          <p className="max-w-2xl text-base sm:text-lg text-slate-300 mb-10 leading-relaxed">
            Experience next-generation travel orchestration: personalized multi-POI recommendations, 
            zero-overlap feasible scheduling, transparent uncertainty budgeting, and full offline survivability.
          </p>

          {/* Action CTAs */}
          <div className="flex flex-col sm:flex-row gap-4 w-full sm:w-auto justify-center mb-16">
            <button
              onClick={onDemoLogin}
              id="btn-landing-demo-login"
              className="px-8 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-base shadow-xl shadow-emerald-600/25 transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2"
            >
              <span>Demo Login</span>
              <span>(Priya & Rahul)</span>
            </button>
            <button
              onClick={onStartPlanning}
              id="btn-landing-plan"
              className="px-8 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold text-base transition flex items-center justify-center gap-2"
            >
              <span>Instant Plan Trip</span>
              <span>→</span>
            </button>
          </div>

          {/* IEEE Research-backed Pillar Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-left w-full">
            <div className="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
              <div className="w-10 h-10 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl mb-3">
                🎯
              </div>
              <h3 className="text-white font-bold text-sm mb-1">Explainable POI Ranking</h3>
              <p className="text-xs text-slate-400 leading-relaxed">
                Multi-attribute normalized scoring across preference match, context, distance, quality, budget, and timing.
              </p>
            </div>

            <div className="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
              <div className="w-10 h-10 rounded-lg bg-teal-500/10 text-teal-400 flex items-center justify-center text-xl mb-3">
                ⏱️
              </div>
              <h3 className="text-white font-bold text-sm mb-1">Constraint Feasibility</h3>
              <p className="text-xs text-slate-400 leading-relaxed">
                Respects opening hours, realistic hill transit speeds, dedicated meal windows, and strict daylight bounds.
              </p>
            </div>

            <div className="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
              <div className="w-10 h-10 rounded-lg bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-xl mb-3">
                💵
              </div>
              <h3 className="text-white font-bold text-sm mb-1">Predictive Budgeting</h3>
              <p className="text-xs text-slate-400 leading-relaxed">
                Itemized expense forecasts with min/expected/max intervals and strict budget variance alerting.
              </p>
            </div>

            <div className="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
              <div className="w-10 h-10 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center text-xl mb-3">
                📦
              </div>
              <h3 className="text-white font-bold text-sm mb-1">Offline Survivability</h3>
              <p className="text-xs text-slate-400 leading-relaxed">
                Downloadable offline bundle with cached GPS coordinates, route sequences, and emergency helpline numbers.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ================= 2. DASHBOARD VIEW =================
    function DashboardView({ user, savedTrips, onPlanNew, onViewTrip }) {
      return (
        <div className="max-w-6xl mx-auto px-4 py-8 sm:px-6 w-full">
          {/* Welcome Header */}
          <div className="bg-gradient-to-r from-slate-900 via-slate-850 to-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 shadow-xl">
            <div>
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-semibold mb-2">
                <span>Demo Traveler Account</span>
              </div>
              <h2 className="text-2xl sm:text-3xl font-bold text-white mb-1">
                Namaste, {user?.name || 'Traveler'}! 🌿
              </h2>
              <p className="text-sm text-slate-400">
                Ready to plan your intelligent, optimized vacation across God's Own Country.
              </p>
            </div>
            <button
              onClick={onPlanNew}
              id="btn-dashboard-plan-trip"
              className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-600/25 flex items-center gap-2 whitespace-nowrap"
            >
              <span>+ Plan New Trip</span>
            </button>
          </div>

          {/* Quick Metrics */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
              <span className="text-xs text-slate-400 font-medium">Default Budget</span>
              <p className="text-xl font-bold text-white mt-1">₹15,000</p>
            </div>
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
              <span className="text-xs text-slate-400 font-medium">Trip Duration</span>
              <p className="text-xl font-bold text-white mt-1">3 Days</p>
            </div>

        "Computing Normalized Multi-Feature Scores (IEEE ICUIS 2025)",

        "Itemizing Predictive Budget & Synthesizing Offline Bundle"
      ];

      return (
        <div className="flex-1 flex flex-col justify-center items-center px-4 py-16 text-center max-w-md mx-auto">

          <p className="text-xs text-slate-400 mb-8">
            Applying IEEE multi-attribute scoring and constraint satisfiability...
          </p>

          <div className="w-full space-y-3 text-left">
            {steps.map((s, idx) => {
              const isDone = step > idx + 1;
              const isCurrent = step === idx + 1;
              return (
                <div 
                  key={idx} 
                  className={`p-3 rounded-xl border text-xs font-semibold flex items-center gap-3 transition-all ${
                    isDone 
                      ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' 
                      : isCurrent 
                      ? 'bg-slate-800 border-emerald-500 text-white shadow-md' 
                      : 'bg-slate-900/40 border-slate-800 text-slate-500'
                  }`}
                >
                  <span className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] bg-slate-800">
                    {isDone ? '✓' : isCurrent ? '⏳' : idx + 1}
                  </span>
                  <span>{s}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ================= 5B. MAP SUB-VIEW =================
    function MapSubView({ trip, selectedDay }) {
      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const [filterCategory, setFilterCategory] = useState('all');

      useEffect(() => {
        if (!mapContainerRef.current) return;

        // Cleanup existing map instance
        if (leafletMapRef.current) {
          leafletMapRef.current.remove();
          leafletMapRef.current = null;
        }

        // Center on Munnar coordinates
        const map = L.map(mapContainerRef.current).setView([10.0889, 77.0595], 11);
        leafletMapRef.current = map;

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Collect markers from daily plans
        const stopsToRender = [];
        trip.daily_plans.forEach(plan => {
          if (filterCategory === 'all' || filterCategory === `day_${plan.day_number}`) {
            plan.stops.forEach(stop => {
              stopsToRender.push({ ...stop, day: plan.day_number });
            });
          }
        });

        // Add pins
        const bounds = [];
        const latlngs = [];

        stopsToRender.forEach((s) => {
          if (s.lat && s.lng) {
            const isHotel = s.type === 'hotel_checkin';
            const isFood = s.type.startsWith('food');
            
            // Custom circle marker
            const markerColor = isHotel ? '#6366f1' : isFood ? '#f59e0b' : s.category === 'Waterfalls' ? '#06b6d4' : '#10b981';
            
            const marker = L.circleMarker([s.lat, s.lng], {
              radius: 9,
              fillColor: markerColor,
              color: '#ffffff',
              weight: 2,
              opacity: 1,
              fillOpacity: 0.9
            }).addTo(map);

            marker.bindPopup(`
              <div style="font-family: sans-serif; font-size: 12px;">
                <b style="color: #38bdf8; font-size: 13px;">${s.name}</b><br/>
                <span style="color: #94a3b8;">${s.category} • Day ${s.day} (${s.start_time})</span><br/>
                <p style="margin: 4px 0 0 0; color: #cbd5e1;">${s.description}</p>
              </div>
            `);

            bounds.push([s.lat, s.lng]);
            latlngs.push([s.lat, s.lng]);
          }
        });

        // Add polyline connecting route
        if (latlngs.length > 1) {
          L.polyline(latlngs, {
            color: '#10b981',
            weight: 3,
            opacity: 0.8,
            dashArray: '6, 8'
          }).addTo(map);
        }

        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 13 });
        }

        const resizeTimer = setTimeout(() => {
          if (leafletMapRef.current) {
            leafletMapRef.current.invalidateSize();
            if (bounds.length > 0) {
              leafletMapRef.current.fitBounds(bounds, { padding: [50, 50], maxZoom: 13 });
            }
          }
        }, 200);

        return () => {
          clearTimeout(resizeTimer);
          if (leafletMapRef.current) {
            leafletMapRef.current.remove();
            leafletMapRef.current = null;
          }
        };
      }, [trip, filterCategory]);

      return (
        <div className="space-y-4">
          {/* Map Filters */}
          <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900 p-3 rounded-2xl border border-slate-800">
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold text-slate-300">Filter Layer:</span>
              <button
                onClick={() => setFilterCategory('all')}
                id="btn-map-all"
                className={`text-xs px-2.5 py-1 rounded-lg font-semibold transition ${filterCategory === 'all' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}`}
              >
                All Stops
              </button>
              {[1, 2, 3].map(d => (
                <button
                  key={d}
                  onClick={() => setFilterCategory(`day_${d}`)}
                  id={`btn-map-day-${d}`}
                  className={`text-xs px-2.5 py-1 rounded-lg font-semibold transition ${filterCategory === `day_${d}` ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}`}
                >
                  Day {d} Only
                </button>
              ))}
            </div>

            {/* Map Legend */}
            <div className="flex items-center gap-3 text-[11px] text-slate-400">
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-cyan-400 inline-block"></span> Waterfalls</span>
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block"></span> Trekking</span>
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-indigo-500 inline-block"></span> Hotel</span>
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span> Local Food</span>
            </div>
          </div>

          {/* Interactive Map Box */}
          <div

            className="w-full h-[450px] sm:h-[550px] rounded-3xl border border-slate-800 overflow-hidden shadow-2xl z-10"
          />

      );

              </h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {pkg?.emergency_contacts?.map(contact => (
                  <div key={contact.name} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                    <div>
                      <span className="text-xs font-bold text-white block">{contact.name}</span>
                      <span className="text-[10px] text-slate-400">{contact.type}</span>
                    </div>
                    <span className="text-xs font-mono font-bold text-emerald-400 bg-slate-800 px-2.5 py-1 rounded-lg">
                      {contact.phone}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ================= 6. SAVED TRIPS VIEW =================
    function SavedTripsView({ savedTrips, onSelectTrip, onDeleteTrip, onPlanNew }) {
      return (
        <div className="max-w-5xl mx-auto px-4 py-8 sm:px-6 w-full">
          <div className="flex items-center justify-between mb-6">
            <div>
              <h2 className="text-2xl font-bold text-white">Saved Itineraries</h2>
              <p className="text-xs text-slate-400">Trips saved to local storage and active session memory</p>
            </div>
            <button
              onClick={onPlanNew}
              id="btn-saved-trips-plan-new"
              className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition"
            >
              + Plan New Trip
            </button>
          </div>

          {savedTrips.length === 0 ? (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-12 text-center">
              <p className="text-sm text-slate-400 mb-4">No trips currently saved.</p>
              <button onClick={onPlanNew} className="text-emerald-400 text-xs font-bold hover:underline">
                Generate your 3-day Kerala plan now →
              </button>
            </div>
          ) : (
            <div className="space-y-4">
              {savedTrips.map(trip => (
                <div key={trip.trip_id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-xs font-bold text-emerald-400">{trip.profile.destination}</span>
                      <span className="text-slate-600">•</span>
                      <span className="text-xs text-slate-400">{trip.profile.duration_days} Days</span>
                      <span className="text-slate-600">•</span>
                      <span className="text-xs text-slate-400">{trip.profile.number_of_travelers} Travelers</span>
                    </div>
                    <h3 className="text-base font-bold text-white">
                      ₹{trip.profile.budget.toLocaleString()} Cap Itinerary
                    </h3>
                    <p className="text-xs text-slate-400 mt-1">
                      {trip.profile.interests.join(', ')} • {trip.profile.hotel_preference} • {trip.profile.food_preference}
                    </p>
                  </div>

                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    <button
                      onClick={() => onSelectTrip(trip)}
                      id={`btn-open-trip-${trip.trip_id}`}
                      className="flex-1 sm:flex-initial bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition"
                    >
                      View Trip
                    </button>
                    <button
                      onClick={() => onDeleteTrip(trip.trip_id)}
                      id={`btn-delete-trip-${trip.trip_id}`}
                      className="bg-slate-800 hover:bg-rose-950 hover:text-rose-400 text-slate-400 text-xs font-bold px-3 py-2 rounded-xl border border-slate-700 transition"
                    >
                      Delete
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
